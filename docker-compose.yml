services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-decitrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decitrace}
      POSTGRES_DB: ${POSTGRES_DB:-decitrace}
    # 5433 on the host so it does not clash with a locally installed PostgreSQL on 5432.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - decitrace-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-decitrace} -d ${POSTGRES_DB:-decitrace}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  decitrace-db:
