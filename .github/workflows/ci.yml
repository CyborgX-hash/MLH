name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Install, test and validate (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the project and its dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the unit tests
        run: python -m pytest -q

      - name: Validate - required deliverables exist
        run: |
          for f in LICENSE HACKATHON.md README.md .github/pull_request_template.md \
                   examples/sample_input.json examples/sample_output.json; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done

      - name: Validate - end-to-end pipeline on a bundled thread (offline, no model)
        run: |
          decisionlens extract tests/fixtures/mini_thread.json -o /tmp/decisions.json --backend heuristic
          decisionlens search /tmp/decisions.json "memory leak in a global cache" --embeddings tfidf
          decisionlens pr /tmp/decisions.json --files parser/cache.py --text "add a global cache" --embeddings tfidf

      - name: Validate - committed example outputs are well-formed and fully cited
        run: python scripts/validate_examples.py
