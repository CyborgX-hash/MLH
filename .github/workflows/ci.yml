name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Install, test and validate (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the project and its dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the unit tests
        run: python -m pytest -q

      - name: Validate - required deliverables exist
        run: |
          for f in LICENSE HACKATHON.md README.md .github/pull_request_template.md \
                   examples/sample_input.json examples/sample_output.json; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done

      - name: Validate - end-to-end pipeline on a bundled thread (offline, no model)
        run: |
          decisionlens extract tests/fixtures/mini_thread.json -o /tmp/decisions.json --backend heuristic
          decisionlens search /tmp/decisions.json "memory leak in a global cache" --embeddings tfidf
          decisionlens pr /tmp/decisions.json --files parser/cache.py --text "add a global cache" --embeddings tfidf

      - name: Validate - committed example outputs are well-formed and fully cited
        run: python scripts/validate_examples.py

  backend:
    name: Backend (FastAPI + PostgreSQL/pgvector)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: decitrace
          POSTGRES_PASSWORD: decitrace
          POSTGRES_DB: decitrace
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U decitrace" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://decitrace:decitrace@localhost:5433/decitrace
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Static checks (broken imports, undefined names)
        run: pip install ruff && ruff check app tests --select F,E9 --ignore F811
      - name: Apply migrations (enables pgvector)
        run: alembic upgrade head
      - name: Migrations match the models
        run: alembic check
      - name: Run tests, including the live database health check
        run: python -m pytest -q

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build
