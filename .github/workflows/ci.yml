name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Repository & Examples Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Required Repository Files Exist
        run: |
          echo "Checking mandatory repository structure..."
          test -f LICENSE || (echo "Missing LICENSE" && exit 1)
          test -f HACKATHON.md || (echo "Missing HACKATHON.md" && exit 1)
          test -f README.md || (echo "Missing README.md" && exit 1)
          test -f .github/pull_request_template.md || (echo "Missing PR template" && exit 1)
          test -d examples || (echo "Missing examples directory" && exit 1)
          echo "All mandatory files present."

      - name: Validate Example JSON Schemas and Payloads
        run: |
          echo "Validating JSON syntax in examples/..."
          for file in examples/*.json; do
            echo "Checking $file"
            python -m json.tool "$file" > /dev/null || exit 1
          done
          echo "All example payloads are valid JSON."
