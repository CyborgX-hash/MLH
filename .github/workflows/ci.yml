name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Submission Deliverables & Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Required Deliverables
        run: |
          echo "Verifying mandatory hackathon deliverables..."
          test -f LICENSE || (echo "Missing LICENSE" && exit 1)
          test -f HACKATHON.md || (echo "Missing HACKATHON.md" && exit 1)
          test -f README.md || (echo "Missing README.md" && exit 1)
          test -f .github/pull_request_template.md || (echo "Missing PR template" && exit 1)
          test -f examples/sample_input.json || (echo "Missing examples/sample_input.json" && exit 1)
          test -f examples/sample_output.json || (echo "Missing examples/sample_output.json" && exit 1)
          echo "All required deliverables are present."

      - name: Validate Example JSON Payloads
        run: |
          echo "Validating syntax of sample inputs and outputs in examples/..."
          for file in examples/*.json; do
            echo "Checking $file..."
            python -m json.tool "$file" > /dev/null || exit 1
          done
          echo "All JSON files in examples/ are valid."
